[package]
name = "gitseed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4.6.9", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
librqbit = "9.1.0"
mainline = "8.0.1"
rand = "0.10.4"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
ureq = "3.5.2"
